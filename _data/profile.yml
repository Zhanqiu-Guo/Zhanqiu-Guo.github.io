short_bio: >-
  <p>
    I am an M.S. student in the <a href="https://ml.cmu.edu/" target="_blank">Machine Learning Department</a> at <a href="https://www.cmu.edu/" target="_blank">Carnegie Mellon University</a>, expected to graduate in December 2026. My research focuses on multimodal agents that interact with complex environments, including Vision-Language-Action models, web agents, and clinical multimodal AI systems. I am particularly interested in building models that go beyond recognizing static inputs, grounding perception, language, memory, and feedback in settings where actions have real consequences.
  </p>
  <p>
    I am currently advised by <a href="https://www.cs.cmu.edu/~cx/" target="_blank">Prof. Chenyan Xiong</a> in the <a href="https://www.cs.cmu.edu/~cxcscmu/" target="_blank">CX Research Group</a>. Before CMU, I received my B.S. in Computer Science and Mathematics from <a href="https://www.nyu.edu/" target="_blank">New York University</a>, where I was fortunate to be advised by <a href="https://www.lerrelpinto.com/" target="_blank">Prof. Lerrel Pinto</a> in the <a href="https://www.lerrelpinto.com/" target="_blank">General-purpose Robotics and AI Lab (GRAIL)</a> and by <a href="https://seyiqi.github.io/" target="_blank">Prof. Yiqiu (Artie) Shen</a>.
  </p>

